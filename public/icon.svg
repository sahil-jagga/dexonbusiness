<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.4"/>

  <!-- Sun Center -->
  <circle cx="256" cy="230" r="76" fill="url(#sunGrad)"/>

  <!-- Sun Rays -->
  <g stroke="url(#sunGrad)" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="76"/>
    <line x1="256" y1="350" x2="256" y2="384"/>
    <line x1="136" y1="230" x2="102" y2="230"/>
    <line x1="376" y1="230" x2="410" y2="230"/>
    <line x1="171" y1="145" x2="147" y2="121"/>
    <line x1="341" y1="315" x2="365" y2="339"/>
    <line x1="171" y1="315" x2="147" y2="339"/>
    <line x1="341" y1="145" x2="365" y2="121"/>
  </g>

  <!-- Solar Panel Grid in Sun -->
  <g stroke="#78350f" stroke-width="4" opacity="0.5">
    <line x1="256" y1="154" x2="256" y2="306"/>
    <line x1="180" y1="230" x2="332" y2="230"/>
  </g>

  <!-- Bill / Document Symbol Overlay -->
  <rect x="270" y="240" width="130" height="170" rx="14" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>
  <rect x="290" y="270" width="90" height="10" rx="5" fill="#f59e0b"/>
  <rect x="290" y="295" width="70" height="8" rx="4" fill="#94a3b8"/>
  <rect x="290" y="315" width="80" height="8" rx="4" fill="#94a3b8"/>
  <rect x="290" y="340" width="90" height="12" rx="4" fill="#10b981"/>

  <!-- Text -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    NEX<tspan fill="#f59e0b">BILL</tspan>
  </text>
</svg>
